name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: self-test (windows)
    runs-on: windows-latest
    env:
      AHK_VERSION: 2.0.26

    steps:
      - uses: actions/checkout@v4

      - name: Download AutoHotkey v2
        shell: pwsh
        run: |
          $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$env:AHK_VERSION/AutoHotkey_$env:AHK_VERSION.zip"
          Invoke-WebRequest $url -OutFile ahk.zip -UseBasicParsing
          Expand-Archive ahk.zip -DestinationPath ahk -Force
          if (-not (Test-Path 'ahk\AutoHotkey64.exe')) { throw 'AutoHotkey64.exe not found in the release archive' }

      - name: Run self-test
        shell: pwsh
        run: |
          $out = & '.\ahk\AutoHotkey64.exe' '.\AltShift.ahk' '--selftest' 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          # the exit code is the contract: it equals the number of failed assertions
          if ($code -ne 0) { throw "$code assertion(s) failed" }
          if ($out -notmatch 'ALL TESTS PASSED') {
              Write-Warning 'Exit code was 0 but the runner did not capture the test output.'
          }

  install:
    name: one-liner install on a clean machine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Same code path as `irm ... | iex`: no $PSScriptRoot, so every file is fetched
      # over HTTP from this exact commit, and AutoHotkey is downloaded and checksum-verified.
      - name: Install
        shell: powershell
        run: |
          $raw = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA"
          $sb  = [scriptblock]::Create((Get-Content -Raw .\install.ps1))
          & $sb -RepoRaw $raw -NoStartup -NoLaunch
          if (-not (Test-Path "$env:LOCALAPPDATA\AltShift\ahk\AutoHotkey64.exe")) { throw 'portable AutoHotkey missing' }
          if (-not (Test-Path "$env:LOCALAPPDATA\AltShift\settings.ini"))        { throw 'settings.ini missing' }

      - name: Re-run is idempotent
        shell: powershell
        run: |
          $out = .\install.ps1 -NoStartup -NoLaunch 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'already in')          { throw 'second run re-downloaded AutoHotkey' }
          if ($out -notmatch 'kept your existing')  { throw 'second run replaced settings.ini' }

      - name: Uninstall
        shell: powershell
        run: |
          .\uninstall.ps1
          if (Test-Path "$env:LOCALAPPDATA\AltShift") { throw 'uninstall left files behind' }
